<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>TF Demo · strict CSP</title>
  <style>
    body { font: 15px/1.6 system-ui, sans-serif; max-width: 560px; margin: 3rem auto; padding: 0 1rem; }
    button { font: inherit; padding: .45rem .8rem; }
    #route { color: #7c3aed; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Strict CSP</h1>
  <p>
    Served with <code>script-src 'self' 'unsafe-inline'</code> — no
    <code>'unsafe-eval'</code>, which is what almost every real site ships. Anything
    the replayer tries to evaluate as a string is refused by the browser here.
  </p>

  <!-- An SPA route change: pushState only, no page load. The recorder writes this
       as a waitForExpression on location, which is precisely the step that needs
       evaluating on replay. -->
  <button id="go-checkout" onclick="
    history.pushState({}, '', '/demo-csp.html#/checkout');
    document.getElementById('route').textContent = 'checkout';
  ">Go to checkout</button>
  <span>route: <span id="route">home</span></span>

  <p>
    <button id="mark" onclick="document.getElementById('state').textContent = 'marked'">
      Mark
    </button>
    <span>state: <b id="state">—</b></span>
  </p>
</body>
</html>
